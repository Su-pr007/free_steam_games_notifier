services:
  go:
    build:
      context: ./
    depends_on:
      - pg
    volumes:
      - ./:/app
    ports:
      - ${APP_PORT}:${APP_PORT}

  pg:
    image: postgres:16.0-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${EXTERNAL_DB_PORT}:5432'

volumes:
  postgres_data:

networks:
  default: